- name: create ec2 and r53 records
  hosts: all
  connection: local
  vars:
   sg_id: sg-0e952a919361d18ab
   ami_id: ami-0220d79f3f480ecf5
   domain_name: sivadevops.site
   instances:
    - mongodb
    - catalogue
  tasks:
  ### CREATE ###
   - name: create ec2 instance
     amazon.aws.ec2_instance:
      instance_type: "t2.micro"
      security_group: "{{ sg_id }}"
      vpc_subnet_id: subnet-0e2d2a34508988aa6
      image_id: "{{ ami_id }}"
      name: "{{ item }}-{{ env }}"
      wait: false
      tags:
        Project: roboshop
        Component: "{{ item }}"
        Environment: "{{ env }}"
        Name: "{{ item }}-{{ env }}"
     loop: "{{ instances }}"
     register: ec2_output
   
   - name: print the output
     ansible.builtin.debug:
      msg: "{{ ec2_output }}"