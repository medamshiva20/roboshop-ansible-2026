- name: create ec2 and r53 records
  hosts: all
  connection: local
  vars:
   sg_id: sg-0e952a919361d18ab
   ami_id: ami-0220d79f3f480ecf5
   env: dev
   domain_name: sivadevops.site
  #  instances:
  #   - mongodb
  #   - catalogue
  tasks:
   - name: create ec2 instances
     amazon.aws.ec2_instance:
      vpc_subnet_id: subnet-0e2d2a34508988aa6
      security_group: "{{sg_id}}"
      instance_type: t2.micro
      image_id: "{{ami_id}}"
      name: "{{item}}-{{env}}"
      tags:
       Project: roboshop
       Catalogue: "{{item}}"
       Environment: "{{env}}"
       Name: "{{item}}-{{env}}"
     loop:
      - mongodb
      - catalogue
     register: ec2_output