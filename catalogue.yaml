- name: Configure catalogue
  hosts: catalogue
  become: yes
  tasks:
   - name: Disable default node js module 
     ansible.builtin.command: dnf module disable nodejs -y
   - name: Enable node js 20 version
     ansible.builtin.command: dnf module enable nodejs:20 -y 
   - name: Install nodejs
     ansible.builtin.dnf:
      name: nodejs
      state: present
   - name: Create system user
     ansible.builtin.user:
      name: roboshop
      system: true
      home: /app
      comment: "roboshop system user"
   - name: create app directory to store application code
     ansible.builtin.file:
      name: /app
      state: directory
   - name: download the application code 
     ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip
      dest: /tmp/catalogue.zip
   - name: Unarchive the downloaded app code 
     ansible.builtin.unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes
   - name: Install packages based on package.json
     community.general.npm:
      path: /app/
   - name: Create the systemd service 
     anisble.builtin.copy:
      src: catalogue.service
      dest: /etc/systemd/system/catalogue.service
   - name: Start and Enable the service
     ansible.builtin.service:
      name: catalogue
      state: started
      enabled: yes
   - name: Copy mongo.repo
     ansible.builtin.copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo
   - name: Install mongodb client package
     ansible.builtin.dnf:
      name: mongodb-mongosh
      state: present
   - name: check products loaded 
     ansible.builtin.command: mongosh --host "{{ MONGODB_HOST }}" --quiet  --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
     register: catalogue_output
   - name: print the output
     ansible.builtin.debug:
      msg: "{{catalogue_output}}"
   - name: load the products
     ansible.builtin.shell: mongosh --host "{{MONGODB_HOST}}" < /app/db/master-data.js
     when: catalogue_output.stdout < 0
   - name: Restart the catalogue service 
     ansible.builtin.service:
      name: catalogue
      state: restarted
